[project]
name = "kitchen-http"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = ["kitchen-core", "fastapi>=0.161.0,<1"]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
kitchen_http = "src"

[tool.setuptools.package-data]
kitchen_http = ["py.typed"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/py.typed" }]
