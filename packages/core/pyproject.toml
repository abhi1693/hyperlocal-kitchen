[project]
name = "kitchen-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0.40,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "pydantic-settings>=2.8,<3", "pyjwt[crypto]>=2.15,<3", "httpx>=0.28,<1", "redis>=5,<8"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
kitchen_core = "src"


[tool.setuptools.package-data]
kitchen_core = ["py.typed"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/py.typed" }]
