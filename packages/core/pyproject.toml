[project]
name = "kitchen-core"
version = "0.1.1"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.1.6,<3", "psycopg[binary]>=3.3.6,<4", "alembic>=1.20.1,<2", "pydantic-settings>=2.16.1,<3", "pyjwt[crypto]>=2.15.1,<3", "httpx>=0.28.1,<1", "redis>=8.1.0,<9"]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
kitchen_core = "src"


[tool.setuptools.package-data]
kitchen_core = ["py.typed"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/py.typed" }]
