name: Backend tests
on:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    name: Python lint, formatting and types
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.21'
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run --no-sync pre-commit validate-config
      - run: uv run --no-sync pre-commit run ruff-check --all-files
      - run: uv run --no-sync pre-commit run ruff-format --all-files
      - run: uv run --no-sync pre-commit run mypy --all-files
  integration:
    name: PostgreSQL and Redis integration tests
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: kitchen_test
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U ci -d kitchen_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379/tcp']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      KITCHEN_ENVIRONMENT: test
      KITCHEN_COOKIE_SECURE: "true"
      KITCHEN_OIDC_ISSUER_URL: https://identity.example.test
      KITCHEN_OIDC_ORGANIZATION_ID: test-org
      KITCHEN_ADMIN_OIDC_CLIENT_ID: test-admin
      KITCHEN_USER_OIDC_CLIENT_ID: test-resident
      KITCHEN_USER_BASE_URL: https://user.example.test
      KITCHEN_ADMIN_REQUIRED_ROLE: platform_admin
      KITCHEN_ADMIN_BASE_URL: https://admin.example.test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.21'
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: Configure disposable service URLs
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          {
            echo "KITCHEN_TEST_DATABASE_URL=postgresql+psycopg://ci:ci@127.0.0.1:$POSTGRES_PORT/kitchen_test"
            echo "KITCHEN_DATABASE_URL=postgresql+psycopg://ci:ci@127.0.0.1:$POSTGRES_PORT/kitchen_test"
            echo "KITCHEN_TEST_REDIS_URL=redis://127.0.0.1:$REDIS_PORT/15"
          } >> "$GITHUB_ENV"
      - name: Run migrations and backend tests through the commit hook
        env:
          PYTEST_ADDOPTS: --junitxml=reports/backend.xml
        run: uv run --no-sync pre-commit run backend-tests --all-files
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-test-results-${{ github.run_attempt }}
          path: |
            reports/backend.xml
            reports/coverage.xml
            reports/coverage.json
            reports/coverage-html
          if-no-files-found: warn
          retention-days: 14
