[project]
name = "hyperlocal-kitchen"
version = "0.1.0"
description = "Private hyperlocal food marketplace for communities"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.config-settings-package]
kitchen-core = { editable_mode = "strict" }
kitchen-http = { editable_mode = "strict" }
kitchen-api = { editable_mode = "strict" }
kitchen-admin-api = { editable_mode = "strict" }
kitchen-worker = { editable_mode = "strict" }

[tool.uv.workspace]
members = ["apps/api", "apps/admin-api", "apps/worker", "packages/core", "packages/http"]

[tool.uv.sources]
kitchen-core = { workspace = true }
kitchen-http = { workspace = true }
kitchen-api = { workspace = true }
kitchen-admin-api = { workspace = true }
kitchen-worker = { workspace = true }

[dependency-groups]
dev = [
    "kitchen-api",
    "kitchen-admin-api",
    "kitchen-worker",
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
    "mypy>=1.15,<3",
    "httpx>=0.28,<1",
    "pre-commit>=4.3,<5",
    "pytest-cov>=6,<8",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov --cov-report=term-missing --cov-report=xml --cov-report=json --cov-report=html"

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["packages/core/src", "packages/http/src", "apps/api/src", "apps/admin-api/src", "apps/worker/src"]

[tool.coverage.report]
fail_under = 100
show_missing = true
precision = 2

[tool.coverage.html]
directory = "reports/coverage-html"

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.coverage.json]
output = "reports/coverage.json"
